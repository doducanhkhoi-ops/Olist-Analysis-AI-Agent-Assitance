  <!-- Q1 -->
  <rect x="36" y="275" width="618" height="90" rx="8" fill="#141E34" stroke="#1E2D4A"/>
  <rect x="36" y="275" width="5" height="90" rx="2" fill="#38bdf8"/>
  <text x="54" y="300" fill="#38bdf8" font-size="13" font-weight="800">Q1: Chuẩn SLA (Seller Đúng Hạn, Carrier Đúng Hạn)</text>
