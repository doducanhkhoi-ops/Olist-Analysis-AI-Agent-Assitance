  <text x="36" y="130" fill="#94a3b8" font-size="11" font-weight="700">TỔNG ĐƠN DELIVERED</text>
  <text x="36" y="162" fill="#ffffff" font-size="24" font-weight="800" font-family="'JetBrains Mono', monospace">96,999</text>
  <text x="36" y="180" fill="#64748b" font-size="10.5">100% hoàn thành</text>

  <!-- Card 2 -->
  <rect x="272" y="105" width="232" height="88" rx="10" fill="#0E1526" stroke="#1E2D4A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="272" y="105" width="4" height="88" rx="2" fill="#10b981"/>
  <text x="288" y="130" fill="#94a3b8" font-size="11" font-weight="700">CARRIER CỨU ĐƠN (Q2)</text>
  <text x="288" y="162" fill="#34d399" font-size="24" font-weight="800" font-family="'JetBrains Mono', monospace">79.26%</text>
  <text x="288" y="180" fill="#64748b" font-size="10.5">6,944 đơn seller ngâm trễ</text>

