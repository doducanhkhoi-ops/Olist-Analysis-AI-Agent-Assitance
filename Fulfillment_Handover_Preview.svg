  <rect x="524" y="105" width="232" height="88" rx="10" fill="#0E1526" stroke="#1E2D4A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="524" y="105" width="4" height="88" rx="2" fill="#f43f5e"/>
