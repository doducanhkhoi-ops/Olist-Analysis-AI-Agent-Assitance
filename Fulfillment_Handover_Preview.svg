  <rect x="830" y="380" width="310" height="15" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="830" y="380" width="56" height="15" rx="4" fill="#10b981"/>
  <text x="896" y="392" fill="#34d399" font-size="11" font-weight="700">2.65% (Tối ưu SLA)</text>

  <text x="706" y="426" fill="#fbbf24" font-size="11" font-style="italic">⚡ Cảnh báo: CE và BA có transit thực tế khi trễ vượt 40 ngày do thiếu hub chia chọn!</text>

  <!-- BOTTOM RIGHT (CATEGORY SELLER LAG) -->
