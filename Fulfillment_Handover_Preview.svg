  <text x="54" y="342" fill="#94a3b8" font-size="11.5">Seller chuẩn bị: <tspan fill="#34d399">2.5 ngày</tspan> | Transit: <tspan fill="#34d399">8.0 ngày</tspan> | Đệm SLA: <tspan fill="#34d399">+13.1 ngày</tspan></text>
  <text x="54" y="358" fill="#34d399" font-size="12" font-weight="700">Review Score: 4.31 ★ (1-Sao: 6.32% | 5-Sao: 62.57%)</text>

