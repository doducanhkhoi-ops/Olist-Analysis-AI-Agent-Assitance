  <text x="54" y="442" fill="#94a3b8" font-size="11.5">Seller ngâm đơn: <tspan fill="#f43f5e">8.6 ngày (Gấp 3.4x!)</tspan> | Transit: <tspan fill="#34d399">7.6 ngày</tspan> | Đệm SLA: <tspan fill="#34d399">+9.4 ngày</tspan></text>
  <text x="54" y="458" fill="#38bdf8" font-size="12" font-weight="700">Review Score: 4.07 ★ (Khách vẫn rất hài lòng vì đến trước hạn!)</text>

