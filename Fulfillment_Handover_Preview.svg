  <text x="706" y="504" fill="#94a3b8" font-size="11">Sự bất cập khi áp cùng một hạn chót giao hàng tĩnh cho mọi loại hàng</text>

  <!-- Category items -->
  <text x="706" y="534" fill="#f87171" font-weight="700" font-size="12">1. Office Furniture (Nội thất văn phòng):</text>
  <text x="706" y="552" fill="#94a3b8" font-size="11.5">Tỷ lệ seller trễ hạn: <tspan fill="#f43f5e" font-weight="700">28.25%</tspan> | TG chuẩn bị TB: <tspan fill="#f43f5e" font-weight="700">10.8 ngày</tspan> | Review: <tspan fill="#fbbf24">3.52 ★</tspan></text>

  <text x="706" y="582" fill="#E2E8F0" font-weight="600" font-size="12">2. Consoles &amp; Games / Furniture Decor:</text>
