  <text x="54" y="522" fill="#94a3b8" font-size="11.5">Số đơn: <tspan fill="#fb7185" font-weight="700">4,745 (4.89%)</tspan> | GMV: <tspan fill="#FFF">R$ 664.6K</tspan> | AOV: <tspan fill="#FFF">R$ 140.1</tspan></text>
  <text x="54" y="542" fill="#94a3b8" font-size="11.5">Seller giao cực nhanh: <tspan fill="#34d399">3.0 ngày</tspan> | Transit: <tspan fill="#f43f5e">31.6 ngày (Gấp 4x!)</tspan> | Đệm SLA: <tspan fill="#f43f5e">-11.6 ngày</tspan></text>
  <text x="54" y="558" fill="#f43f5e" font-size="12" font-weight="700">Review Score: 2.27 ★ (1-Sao vọt lên 52.39% - Seller bị phạt oan!)</text>

