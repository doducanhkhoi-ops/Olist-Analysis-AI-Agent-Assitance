  <text x="54" y="622" fill="#94a3b8" font-size="11.5">Số đơn: <tspan fill="#f87171" font-weight="700">1,817 (1.87%)</tspan> | GMV: <tspan fill="#FFF">R$ 325.1K</tspan> | AOV: <tspan fill="#FFF">R$ 179.0</tspan></text>
  <text x="54" y="642" fill="#94a3b8" font-size="11.5">Seller ngâm đơn: <tspan fill="#f43f5e">13.9 ngày</tspan> | Transit: <tspan fill="#f43f5e">18.3 ngày</tspan> | Trễ thực tế: <tspan fill="#f43f5e">-10.5 ngày</tspan></text>
  <text x="54" y="658" fill="#ef4444" font-size="12" font-weight="700">Review Score: 2.27 ★ (Đáy đồng nhất: 52.72% chấm 1 sao!)</text>

