  <text x="792" y="162" fill="#fbbf24" font-size="24" font-weight="800" font-family="'JetBrains Mono', monospace">2.27 ★</text>
  <text x="792" y="180" fill="#64748b" font-size="10.5">Rơi -2.04 sao so với chuẩn</text>

