<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#070B14; font-family:'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- HEADER -->
  <rect x="20" y="16" width="1240" height="74" rx="12" fill="#0E1526" stroke="#1E2D4A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="36" y="32" width="130" height="22" rx="5" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="101" y="47" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">LOGISTICS AUDIT</text>
  <text x="180" y="48" fill="#ffffff" font-size="17" font-weight="800">GIẢI PHẪU ĐIỂM NGHẼN BÀN GIAO &amp; NGHỊCH LÝ CARRIER CỨU ĐƠN</text>
  <text x="180" y="68" fill="#94a3b8" font-size="12">Phân Tích Độc Quyền: Seller Handling Latency vs Carrier Transit | CSDL: olist_raw (96,999 Đơn)</text>

