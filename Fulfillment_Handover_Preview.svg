  <text x="1040" y="336" fill="#fb7185" font-size="11" font-weight="700">9.45% (1,174 đơn!)</text>

  <text x="706" y="364" fill="#E2E8F0" font-size="11.5">Espírito Santo (ES)</text>
  <rect x="830" y="352" width="310" height="15" rx="4" fill="rgba(255,255,255,0.05)"/>
