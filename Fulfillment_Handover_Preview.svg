  <text x="706" y="630" fill="#E2E8F0" font-weight="600" font-size="12">3. Consumer Goods (Pet shop, Stationery, Housewares):</text>
  <text x="706" y="648" fill="#94a3b8" font-size="11.5">Tỷ lệ seller trễ: <tspan fill="#34d399">9.5% - 11.4%</tspan> | TG chuẩn bị: <tspan fill="#34d399">3.1 - 3.3 ngày</tspan> | Review: <tspan fill="#34d399">4.11 - 4.24 ★</tspan></text>

  <rect x="706" y="662" width="534" height="26" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)"/>
